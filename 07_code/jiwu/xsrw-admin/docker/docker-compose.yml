version : '3.8'
services:
  xsrw-nacos:
    container_name: xsrw-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - xsrw-mysql
  xsrw-mysql:
    container_name: xsrw-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  xsrw-redis:
    container_name: xsrw-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/xsrw/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/xsrw/redis/redis.conf
  xsrw-nginx:
    container_name: xsrw-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/xsrw/projects/xsrw-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - xsrw-gateway
    links:
      - xsrw-gateway
  xsrw-gateway:
    container_name: xsrw-gateway
    build:
      context: ./xsrw/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - xsrw-redis
    links:
      - xsrw-redis
  xsrw-auth:
    container_name: xsrw-auth
    build:
      context: ./xsrw/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - xsrw-redis
    links:
      - xsrw-redis
  xsrw-modules-system:
    container_name: xsrw-modules-system
    build:
      context: ./xsrw/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - xsrw-redis
      - xsrw-mysql
    links:
      - xsrw-redis
      - xsrw-mysql
  xsrw-modules-gen:
    container_name: xsrw-modules-gen
    build:
      context: ./xsrw/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - xsrw-mysql
    links:
      - xsrw-mysql
  xsrw-modules-job:
    container_name: xsrw-modules-job
    build:
      context: ./xsrw/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - xsrw-mysql
    links:
      - xsrw-mysql
  xsrw-modules-file:
    container_name: xsrw-modules-file
    build:
      context: ./xsrw/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./xsrw/uploadPath:/home/xsrw/uploadPath
  xsrw-visual-monitor:
    container_name: xsrw-visual-monitor
    build:
      context: ./xsrw/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
