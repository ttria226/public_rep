# Tomcat
server: 
  port: 9290

# Spring
spring: 
  application:
    # 应用名称
    name: xsrw-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
        namespace: 45a27989-5078-4dd3-8955-2427acb463fd
      config:
        namespace: 45a27989-5078-4dd3-8955-2427acb463fd
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
